<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Pedidos - Cafetería</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet" />
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">Gestión de Pedidos de la Cafetería</h1>

        <div class="row g-4">
            <!-- Formulario de Registro -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4">
                    <h3 class="h5 mb-3">Nuevo Pedido</h3>
                    <form id="formPedido" novalidate>
                        <div class="mb-3">
                            <label for="txtProducto" class="form-label">Nombre del producto</label>
                            <input type="text" class="form-control" id="txtProducto" required>
                        </div>
                        <div class="mb-3">
                            <label for="txtPrecio" class="form-label">Precio unitario ($)</label>
                            <input type="number" step="0.01" class="form-control" id="txtPrecio" required>
                        </div>
                        <div class="mb-3">
                            <label for="txtCantidad" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="txtCantidad" required>
                        </div>
                        <button type="submit" id="btnAgregar" class="btn btn-primary w-100">Agregar pedido</button>
                    </form>
                </div>

                <!-- Sección de Filtrado -->
                <div class="card shadow-sm p-4 mt-4">
                    <h3 class="h5 mb-3">Filtrar por Precio</h3>
                    <div class="mb-3">
                        <label for="txtPrecioMax" class="form-label">Precio máximo ($)</label>
                        <input type="number" step="0.01" class="form-control" id="txtPrecioMax">
                    </div>
                    <button id="btnFiltrar" class="btn btn-secondary w-100 mb-2">Filtrar productos</button>
                    <button id="btnMostrarTodos" class="btn btn-outline-secondary w-100 mb-2">Mostrar todos</button>
                    <button id="btnLimpiar" class="btn btn-danger w-100">Limpiar pedidos</button>
                </div>
            </div>

            <!-- Tabla y Totales -->
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h3 class="h5 mb-3">Listado de Pedidos</h3>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th scope="col">Producto</th>
                                    <th scope="col">Precio unitario</th>
                                    <th scope="col">Cantidad</th>
                                    <th scope="col">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="idTablaPedidos">
                                <!-- Se llenará dinámicamente con JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Indicadores de Totales -->
                    <div class="alert alert-info mt-3 d-flex justify-content-between mb-0">
                        <div><strong>Total Unidades:</strong> <span id="lblTotalUnidades">0</span></div>
                        <div><strong>Monto Total:</strong> $<span id="lblMontoTotal">0.00</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a href="../index.html" class="btn btn-link text-decoration-none">&larr; Regresar al inicio</a>
        </div>
    </div>

    <!-- Script Externo -->
    <script src="../js/pedidos.js" defer></script>
</body>
</html>
