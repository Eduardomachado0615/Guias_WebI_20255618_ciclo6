
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creando formulario con DOM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="container py-4">

    <a href="../index.html">Volver al inicio</a>

    <h1 class="text-center my-4">
        Creando formulario con DOM
    </h1>

    <div class="row justify-content-center">
        <div class="col-md-8">

            <label for="idCmbElemento">
                Seleccione un elemento
            </label>

            <select id="idCmbElemento" class="form-select mb-3">
                <option value="">Seleccione...</option>
                <option value="select">SELECT</option>
                <option value="radio">RADIO</option>
                <option value="checkbox">CHECKBOX</option>
                <option value="textarea">TEXTAREA</option>
                <option value="text">TEXT</option>
                <option value="number">NUMBER</option>
                <option value="date">DATE</option>
                <option value="password">PASSWORD</option>
                <option value="email">EMAIL</option>
            </select>

            <button
                id="idBtnCrear"
                class="btn btn-primary"
                type="button"
            >
                Crear elemento
            </button>

            <h2 class="mt-5">
                Elementos agregados al nuevo formulario
            </h2>

            <form id="idNewForm" class="mt-4"></form>

        </div>
    </div>

    <!-- Modal Bootstrap -->
    <div class="modal fade" id="idModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Agregando un nuevo control
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <div class="modal-body">

                    <label for="idTituloElemento">
                        Título del elemento
                    </label>

                    <input
                        type="text"
                        id="idTituloElemento"
                        class="form-control mb-3"
                    >

                    <label for="idNombreElemento">
                        ID del elemento
                    </label>

                    <input
                        type="text"
                        id="idNombreElemento"
                        class="form-control"
                    >

                </div>

                <div class="modal-footer">
                    <button
                        id="idBtnAddElement"
                        type="button"
                        class="btn btn-primary"
                    >
                        Agregar elemento
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ejemplo1.js"></script>

</body>
</html>
