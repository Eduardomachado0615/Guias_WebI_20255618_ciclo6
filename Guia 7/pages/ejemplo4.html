
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creando un sitio web</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="container py-4">

    <header class="bg-dark text-white p-3">
        <nav>
            <a href="../index.html" class="text-white">
                Inicio
            </a>

            <span class="mx-3">Guía 07 - DOM</span>
        </nav>
    </header>

    <h1 class="text-center my-4">
        Creando un sitio web
    </h1>

    <div class="mb-4">

        <button
            id="idAgregarPagina"
            class="btn btn-success"
        >
            Agregar página
        </button>

        <button
            id="idAgregarMenu"
            class="btn btn-primary"
        >
            Agregar menú
        </button>

        <button
            id="idAgregarTitulo"
            class="btn btn-danger"
        >
            Agregar título
        </button>

        <button
            id="idAgregarParrafo"
            class="btn btn-warning"
        >
            Agregar párrafo
        </button>

    </div>

    <!-- Contenedor de la página dinámica -->
    <main id="idPagina"></main>

    <script src="../js/ejemplo4.js"></script>

</body>
</html>
