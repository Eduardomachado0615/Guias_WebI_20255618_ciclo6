
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorriendo formulario con DOM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="container py-4">

    <a href="../index.html">Volver al inicio</a>

    <h1 class="text-center">
        Recorriendo formulario con DOM
    </h1>

    <form name="frmRegistro" class="mt-4">

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control">
        </div>

        <div class="mb-3">
            <label>Fecha de nacimiento</label>
            <input type="date" name="fecha" class="form-control">
        </div>

        <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control">
        </div>

        <div class="mb-3">
            <label>Repetir contraseña</label>
            <input type="password" name="repetir" class="form-control">
        </div>

        <div class="mb-3">
            <label>Correo electrónico</label>
            <input type="email" name="email" class="form-control">
        </div>

        <fieldset class="mb-3">
            <legend>Algunos intereses</legend>

            <label>
                <input type="checkbox" name="intereses" value="Programación">
                Programación
            </label>

            <label>
                <input type="checkbox" name="intereses" value="Arte">
                Arte
            </label>

            <label>
                <input type="checkbox" name="intereses" value="Negocios">
                Negocios
            </label>
        </fieldset>

        <fieldset class="mb-3">
            <legend>¿Qué carrera estudia?</legend>

            <label>
                <input type="radio" name="carrera" value="Ingeniería">
                Ingeniería de Software
            </label>

            <label>
                <input type="radio" name="carrera" value="Negocios">
                Negocios
            </label>
        </fieldset>

        <div class="mb-3">
            <label>País de origen</label>

            <select name="pais" class="form-select">
                <option value="">Seleccione un país</option>
                <option value="SV">El Salvador</option>
                <option value="GT">Guatemala</option>
                <option value="HN">Honduras</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Seleccione una imagen</label>
            <input type="file" name="imagen" class="form-control">
        </div>

        <button
            type="button"
            name="btnRegistro"
            class="btn btn-primary"
        >
            Recorrer formulario
        </button>

    </form>

    <!-- Modal de resultados -->
    <div class="modal fade" id="idModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Resultados del formulario
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <div class="modal-body" id="idBodyModal"></div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cerrar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ejemplo2.js"></script>

</body>
</html>
